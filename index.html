<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CODEVAULT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(15, 20, 38, 0.78);
      --card-elevated: rgba(24, 32, 58, 0.85);
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --c-cyan: #22d3ee;
      --c-emerald: #34d399;
      --c-violet: #a78bfa;
      --c-rose: #fb7185;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 12% 12%, rgba(34, 211, 238, 0.14), transparent 36%),
        radial-gradient(circle at 88% 14%, rgba(167, 139, 250, 0.15), transparent 38%),
        radial-gradient(circle at 50% 88%, rgba(52, 211, 153, 0.10), transparent 42%);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Simple Header with CODEVAULT only */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(7, 9, 19, 0.78);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .topbar-inner {
      max-width: 1220px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(90deg, #67e8f9, #c4b5fd, #f9a8d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3.5rem;
    }

    /* Toast */
    .toast {
      padding: 0.85rem 1.15rem;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.35);
      color: #cffafe;
    }

    .toast.error {
      background: rgba(251, 113, 133, 0.14);
      border-color: rgba(251, 113, 133, 0.42);
      color: #ffe4e6;
    }

    /* Auth Card */
    .auth-box {
      max-width: 450px;
      margin: 2rem auto;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 2.2rem;
      box-shadow: 0 24px 55px -15px rgba(0, 0, 0, 0.7);
    }

    .auth-box h2 {
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.3rem;
    }

    .auth-box .sub {
      text-align: center;
      font-size: 0.84rem;
      color: var(--text-secondary);
      margin-bottom: 1.6rem;
    }

    .input-group { margin-bottom: 1.05rem; }

    .input-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.38rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.72rem 0.92rem;
      border-radius: 11px;
      border: 1px solid var(--border-subtle);
      background: rgba(7, 9, 19, 0.8);
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--c-cyan);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.16);
    }

    .auth-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.4rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.7rem 1.15rem;
      border-radius: 11px;
      font-family: inherit;
      font-size: 0.87rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
    }

    .btn-gradient {
      background: linear-gradient(135deg, #22d3ee, #818cf8);
      color: #070913;
      box-shadow: 0 6px 20px rgba(34, 211, 238, 0.25);
    }

    .btn-gradient:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-gradient:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: var(--card-elevated);
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }

    .btn-secondary:hover { border-color: var(--c-violet); color: #ddd6fe; }

    .btn-sm { padding: 0.4rem 0.78rem; font-size: 0.78rem; border-radius: 9px; }

    .btn-del {
      background: rgba(251, 113, 133, 0.12);
      border-color: rgba(251, 113, 133, 0.35);
      color: #fda4af;
    }

    .btn-del:hover { background: rgba(251, 113, 133, 0.24); }

    /* Workspace Panel */
    .workspace {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 1.75rem;
      box-shadow: 0 24px 55px -15px rgba(0, 0, 0, 0.65);
    }

    .ws-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1.3rem;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 1.5rem;
    }

    .ws-title h2 { font-size: 1.25rem; font-weight: 800; }

    .tenant-chip {
      display: inline-block;
      margin-top: 0.3rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: #67e8f9;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.28);
      padding: 0.2rem 0.6rem;
      border-radius: 7px;
    }

    .metrics-strip {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .metric-box {
      background: rgba(7, 9, 19, 0.7);
      border: 1px solid var(--border-subtle);
      padding: 0.45rem 0.85rem;
      border-radius: 11px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .metric-box strong {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
    }

    /* Uploader */
    .upload-box {
      border: 1.5px dashed rgba(167, 139, 250, 0.42);
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.05), rgba(167, 139, 250, 0.06));
      border-radius: 16px;
      padding: 1.35rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.4rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .upload-box.dragover {
      border-color: var(--c-cyan);
      background: rgba(34, 211, 238, 0.12);
    }

    .upload-info h4 { font-size: 0.95rem; font-weight: 700; color: #f1f5f9; }
    .upload-info p { font-size: 0.8rem; color: var(--text-secondary); }

    .upload-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    input[type="file"] {
      max-width: 265px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      background: rgba(7, 9, 19, 0.75);
      border: 1px solid var(--border-subtle);
      padding: 0.42rem 0.65rem;
      border-radius: 10px;
    }

    input[type="file"]::file-selector-button {
      background: rgba(167, 139, 250, 0.18);
      color: #ddd6fe;
      border: none;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-weight: 600;
      margin-right: 0.55rem;
      cursor: pointer;
    }

    /* Search & Filter Bar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      max-width: 360px;
      padding: 0.58rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: rgba(7, 9, 19, 0.75);
      color: var(--text-primary);
      font-size: 0.85rem;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--c-violet);
    }

    /* Table */
    .table-card {
      overflow-x: auto;
      border: 1px solid var(--border-subtle);
      border-radius: 15px;
      background: rgba(7, 9, 19, 0.55);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }

    th {
      text-align: left;
      padding: 0.82rem 1rem;
      font-size: 0.71rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      background: rgba(24, 32, 58, 0.85);
      border-bottom: 1px solid var(--border-subtle);
    }

    td {
      padding: 0.88rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(34, 211, 238, 0.04); }

    .type-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.71rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: rgba(52, 211, 153, 0.12);
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--text-secondary); }
    .btns-row { display: flex; gap: 0.45rem; }
    .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); font-size: 0.88rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-title">CODEVAULT</div>
    </div>
  </header>

  <main class="container">
    <div id="banner" class="toast hidden"></div>

    <!-- Auth View -->
    <section id="authCard" class="auth-box">
      <h2>Sign In</h2>
      <p class="sub">Access your files</p>

      <div class="input-group">
        <label for="emailInput">Email Address</label>
        <input type="email" id="emailInput" placeholder="user@example.com" autocomplete="email" />
      </div>

      <div class="input-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div class="auth-btns">
        <button class="btn btn-gradient" onclick="handleSignIn()">Sign In</button>
        <button class="btn btn-secondary" onclick="handleSignUp()">Sign Up</button>
      </div>
    </section>

    <!-- Vault Workspace -->
    <section id="vaultCard" class="workspace hidden">
      <div class="ws-header">
        <div class="ws-title">
          <h2>My Vault</h2>
          <span class="tenant-chip" id="userEmail"></span>
        </div>

        <div class="metrics-strip">
          <div class="metric-box">Files: <strong id="statCount">0</strong></div>
          <div class="metric-box">Used: <strong id="statSize">0 B</strong></div>
          <button class="btn btn-secondary btn-sm" onclick="loadDocuments()">Refresh</button>
          <button class="btn btn-secondary btn-sm" onclick="handleSignOut()">Sign Out</button>
        </div>
      </div>

      <div class="upload-box" id="dropzone">
        <div class="upload-info">
          <h4>Upload File</h4>
          <p>Drag & drop a file or choose one from your device</p>
        </div>
        <div class="upload-actions">
          <input type="file" id="fileInput" />
          <button class="btn btn-gradient" id="uploadBtn" onclick="uploadDocument()">Upload</button>
        </div>
      </div>

      <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search files..." oninput="renderFilteredDocs()" />
        <span class="mono" id="filterSummary">Showing 0 files</span>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>File Name</th>
              <th>Type</th>
              <th>Size</th>
              <th>Uploaded</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="docTableBody">
            <tr><td colspan="5" class="empty">No files stored yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://nnhktqaxrhwotcqeaqdp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8yqtlBDzJWwFl7wpDhebMQ_2W9B_jjV";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let cachedDocs = [];

    function showBanner(msg, isError = false) {
      const b = document.getElementById('banner');
      b.textContent = msg;
      b.className = isError ? 'toast error' : 'toast';
      b.classList.remove('hidden');
      clearTimeout(window.__bannerTimer);
      window.__bannerTimer = setTimeout(() => b.classList.add('hidden'), 5000);
    }

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        currentUser = session.user;
        onAuthenticated();
      }
    }

    function onAuthenticated() {
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('vaultCard').classList.remove('hidden');
      document.getElementById('userEmail').textContent = currentUser.email;
      loadDocuments();
    }

    async function handleSignUp() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      if (!email || !password) return showBanner('Please enter email and password.', true);

      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) return showBanner(error.message, true);
      if (data.session) {
        currentUser = data.user;
        onAuthenticated();
        showBanner('Account created & signed in.');
      } else {
        showBanner('Account created! Click Sign In.');
      }
    }

    async function handleSignIn() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      if (!email || !password) return showBanner('Please enter email and password.', true);

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) return showBanner(error.message, true);
      currentUser = data.user;
      onAuthenticated();
      showBanner('Signed in successfully.');
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      cachedDocs = [];
      document.getElementById('vaultCard').classList.add('hidden');
      document.getElementById('authCard').classList.remove('hidden');
    }

    async function uploadDocument() {
      const input = document.getElementById('fileInput');
      const file = input.files[0];
      if (!file) return showBanner('Select a file first.', true);

      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.textContent = 'Uploading...';

      try {
        const storagePath = `${currentUser.id}/${Date.now()}_${file.name}`;
        const { error: uploadErr } = await supabaseClient.storage
          .from('vault-files')
          .upload(storagePath, file);
        if (uploadErr) throw uploadErr;

        const { error: dbErr } = await supabaseClient.from('documents').insert({
          user_id: currentUser.id,
          file_name: file.name,
          file_size: file.size,
          mime_type: file.type || 'application/octet-stream',
          storage_path: storagePath
        });
        if (dbErr) throw dbErr;

        input.value = '';
        showBanner(`Uploaded "${file.name}".`);
        loadDocuments();
      } catch (err) {
        showBanner(err.message || 'Upload failed.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload';
      }
    }

    async function loadDocuments() {
      const { data, error } = await supabaseClient
        .from('documents')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) return showBanner(error.message, true);

      cachedDocs = data || [];
      document.getElementById('statCount').textContent = cachedDocs.length;
      const totalBytes = cachedDocs.reduce((sum, d) => sum + (d.file_size || 0), 0);
      document.getElementById('statSize').textContent = formatBytes(totalBytes);
      renderFilteredDocs();
    }

    function renderFilteredDocs() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const filtered = q
        ? cachedDocs.filter(d =>
            (d.file_name || '').toLowerCase().includes(q) ||
            (d.mime_type || '').toLowerCase().includes(q)
          )
        : cachedDocs;

      document.getElementById('filterSummary').textContent =
        `Showing ${filtered.length} of ${cachedDocs.length} files`;

      const tbody = document.getElementById('docTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">${q ? 'No matching files found.' : 'No files stored yet.'}</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(doc => `
        <tr>
          <td><strong>${escapeHtml(doc.file_name)}</strong></td>
          <td><span class="type-pill">${escapeHtml(doc.mime_type)}</span></td>
          <td class="mono">${formatBytes(doc.file_size)}</td>
          <td class="mono">${new Date(doc.created_at).toLocaleString()}</td>
          <td>
            <div class="btns-row">
              <button class="btn btn-secondary btn-sm" onclick="downloadDoc('${doc.storage_path}')">Download</button>
              <button class="btn btn-del btn-sm" onclick="deleteDoc('${doc.id}', '${doc.storage_path}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function downloadDoc(path) {
      const { data, error } = await supabaseClient.storage.from('vault-files').createSignedUrl(path, 60);
      if (error) return showBanner(error.message, true);
      window.open(data.signedUrl, '_blank');
    }

    async function deleteDoc(id, path) {
      await supabaseClient.storage.from('vault-files').remove([path]);
      const { error } = await supabaseClient.from('documents').delete().eq('id', id);
      if (error) return showBanner(error.message, true);
      showBanner('File deleted.');
      loadDocuments();
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    const dropzone = document.getElementById('dropzone');
    ['dragenter', 'dragover'].forEach(evt => {
      dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); });
    });
    dropzone.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) {
        document.getElementById('fileInput').files = e.dataTransfer.files;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      checkSession();
    });
  </script>
</body>
</html>
